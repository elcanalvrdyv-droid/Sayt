<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birlikdə YouTube İzleyək ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-rose-50 min-h-screen text-gray-800 flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 border-b border-rose-100 flex justify-between items-center px-6">
        <h1 class="text-xl font-semibold text-rose-600 flex items-center gap-2">
            <span>❤️</span> Bizim Sinxron Kinoteatrımız
        </h1>
        <div class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium" id="status">
            Qoşulur...
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-7xl mx-auto w-full">
        
        <!-- Video Section -->
        <div class="flex-1 flex flex-col gap-4">
            <!-- URL Input -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-rose-100 flex gap-2">
                <input type="text" id="youtubeUrl" placeholder="YouTube video linkini bura yapışdırın..." 
                       class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-rose-400">
                <button onclick="changeVideo()" 
                        class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition">
                    Yüklə
                </button>
            </div>

            <!-- Video Player Container -->
            <div class="bg-black rounded-2xl overflow-hidden shadow-lg aspect-video relative">
                <div id="player" class="w-full h-full"></div>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="w-full lg:w-80 bg-white rounded-2xl shadow-sm border border-rose-100 flex flex-col h-[500px] lg:h-auto">
            <div class="p-4 border-b border-gray-100 font-semibold text-gray-700 flex items-center justify-between">
                <span>Canlı Söhbət</span>
                <span class="text-xs text-gray-400 font-normal">Siz və Sevgiliniz</span>
            </div>

            <!-- Messages Area -->
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
                <div class="text-center text-xs text-gray-400 my-2">Otağa qoşuldunuz ❤️</div>
            </div>

            <!-- Chat Input -->
            <div class="p-3 border-t border-gray-100 flex gap-2">
                <input type="text" id="chatInput" placeholder="Mesajınızı yazın..." 
                       onkeypress="if(event.key === 'Enter') sendMessage()"
                       class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-rose-400">
                <button onclick="sendMessage()" 
                        class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
                    Göndər
                </button>
            </div>
        </div>
    </div>

    <!-- YouTube API Script -->
    <script>
        const socket = io();
        let player;
        let isRemoteEvent = false;

        // YouTube IFrame API Loader
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ',
                playerVars: {
                    'playsinline': 1,
                    'controls': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Socket Bağlantı Hadisələri
        socket.on('connect', () => {
            document.getElementById('status').innerText = 'Xətdədir';
            document.getElementById('status').className = 'text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium';
        });

        socket.on('disconnect', () => {
            document.getElementById('status').innerText = 'Bağlantı kəsildi';
            document.getElementById('status').className = 'text-xs bg-red-100 text-red-700 px-3 py-1 rounded-full font-medium';
        });

        // Pleyerin Vəziyyətinin Dəyişməsi (Oynat / Dayandır / İrəli-Geri)
        function onPlayerStateChange(event) {
            if (isRemoteEvent) {
                isRemoteEvent = false;
                return;
            }

            const time = player.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) {
                socket.emit('video_control', { action: 'play', time: time });
            } else if (event.data === YT.PlayerState.PAUSED) {
                socket.emit('video_control', { action: 'pause', time: time });
            }
        }

        // Uzaqdan gələn video əmrlərini emal etmək
        socket.on('video_control', (data) => {
            if (!player) return;

            isRemoteEvent = true;
            
            if (Math.abs(player.getCurrentTime() - data.time) > 1.5) {
                player.seekTo(data.time, true);
            }

            if (data.action === 'play') {
                player.playVideo();
            } else if (data.action === 'pause') {
                player.pauseVideo();
            }
        });

        // Video dəyişdirilməsi
        function changeVideo() {
            const url = document.getElementById('youtubeUrl').value;
            const videoId = extractVideoId(url);
            if (videoId) {
                socket.emit('change_video', { videoId: videoId });
                document.getElementById('youtubeUrl').value = '';
            }
        }

        socket.on('change_video', (data) => {
            if (player) {
                player.loadVideoById(data.videoId);
            }
        });

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Çat funksiyası
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message) {
                socket.emit('send_message', { text: message });
                input.value = '';
            }
        }

        socket.on('receive_message', (data) => {
            const messagesDiv = document.getElementById('chatMessages');
            const isMe = data.senderId === socket.id;

            const msgHtml = `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <div class="max-w-[80%] rounded-2xl px-3 py-2 text-sm ${
                        isMe ? 'bg-rose-500 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'
                    }">
                        ${escapeHtml(data.text)}
                    </div>
                </div>
            `;
            messagesDiv.innerHTML += msgHtml;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
